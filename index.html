document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

   <sc-if value=\"{{ hasPending }}\" hint-placeholder-val=\"{{ true }}\">\n        <section style=\"background:#FFFBF0;border:1px solid #F0E0B0;border-radius:16px;padding:18px;margin-bottom:18px\">\n          <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:14px\">\n            <span style=\"width:30px;height:30px;border-radius:9px;background:#FBE6B0;color:#946400;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto\">⏳<\u002Fspan>\n            <div style=\"min-width:0\">\n              <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin:0;color:#5C4A12\">Needs review · human-in-the-loop<\u002Fh2>\n              <div style=\"font-size:11.5px;color:#9a874f;margin-top:2px\">AI flags below 80% confidence — confirm or dismiss before they enter the register.<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"margin-left:auto;font-size:11px;font-weight:700;color:#946400;background:#FBE6B0;border-radius:10px;padding:4px 11px;flex:0 0 auto\">{{ pendingCount }} pending<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px\">\n            <sc-for list=\"{{ reviewQueue }}\" as=\"q\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1px solid #EBDCB0;border-radius:12px;padding:14px;display:flex;flex-direction:column\">\n                <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:8px\">\n                  <span style=\"font-size:10px;font-weight:700;color:{{ q.sevText }};background:{{ q.sevBg }};border-radius:6px;padding:2px 7px;letter-spacing:.3px\">{{ q.sevLabel }}<\u002Fspan>\n                  <span style=\"margin-left:auto;font-size:11px;font-weight:700;color:#946400\">{{ q.conf }}% conf<\u002Fspan>\n                <\u002Fdiv>\n                <button onclick=\"{{ q.open }}\" style=\"text-align:left;background:none;border:none;padding:0;cursor:pointer lid #E4EAE6;border-radius:16px;padding:20px\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n                <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin:0\">Review &amp; audit trail<\u002Fh3>\n                <sc-if value=\"{{ sel.isAccepted }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:11px;font-weight:700;color:#0B7A4F;background:#DBF7E8;border-radius:8px;padding:4px 11px\">✓ Confirmed<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ sel.isPending }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;font-weight:700;color:#946400;background:#FFF1CC;border-radius:8px;padding:4px 11px\">⏳ Pending review<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ sel.isDismissed }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;font-weight:700;color:#B11D14;background:#FBD8D5;border-radius:8px;padding:4px 11px\">✕ Dismissed<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ sel.isPending }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;gap:10px;margin-bottom:16px\">\n                  <button onclick=\"{{ sel.accept }}\" style=\"flex:1;background:#00C46F;color:#04261b;border:none;border-radius:10px;padding:11px;font:600 13px 'IBM Plex Sans';cursor:pointer\">✓ Accept risk<\u002Fbutton>\n                  <button onclick=\"{{ sel.dismiss }}\" style=\"flex:1;background:#fff;color:#B11D14;border:1px solid #F2C9C4;border-radius:10px;padding:11px;font:600 13px 'IBM Plex Sans';cursor:pointer\">✕ Dismiss as false positive<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ sel.audit }}\" as=\"a\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid #EEF2F0\">\n                  <span style=\"color:{{ a.color }};flex:0 0 auto;font-size:13px;line-height:1.4\">{{ a.icon }}<\u002Fspan>\n                  <span style=\"flex:1;font-size:12.5px;color:#3c4a44;line-height:1.4\">{{ a.text }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#9aa8a1;flex:0 0 auto\">{{ a.time }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #E4EAE6;border-radius:16px;padding:20px\">\n              <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin:0 0 13px\">Mitigation plan<\u002Fh3>\n              <p style=\"margin:0 0 14px;font-size:13px;line-height:1.55;color:#3c4a44\">{{ sel.mit }}<\u002Fp>\n              <sc-for list=\"{{ sel.steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid #EEF2F0\">\n                  <span style=\"width:19px;height:19px;border-radius:6px;border:2px solid {{ s.color }};background:{{ s.fill }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto\">{{ s.mark }}<\u002Fspan>\n                  <span style=\"font-size:13px;color:{{ s.textColor }}\">{{ s.text }}<\u002Fspan>\n                  <span style=\"margin-left:auto;font-size:11px;color:#9aa8a1\">{{ s.who }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #E4EAE6;border-radius:16px;padding:20px\">\n              <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin:0 0 13px\">Linked work items<\u002Fh3>\n              <sc-for list=\"{{ sel.linked }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #EEF2F0\">\n                  <span style=\"font-size:12px;font-weight:600;color:#0B7A4F;flex:0 0 auto;width:78px\">{{ l.key }}<\u002Fspan>\n                  <span style=\"font-size:12.5px;color:#3c4a44;flex:1;min-width:0\">{{ l.sum }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:600;color:{{ l.color }};background:{{ l.bg }};border-radius:7px;padding:3px 9px;white-space:nowrap\">{{ l.status }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- RIGHT: AI PANEL -->\n          <div style=\"background:linear-gradient(165deg,#00453A,#00322A);border-radius:16px;padding:20px;color:#DCEFE7;position:sticky;top:0\">\n            <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:16px\">\n              <span style=\"width:30px;height:30px;border-radius:9px;background:rgba(0,231,132,.18);color:#00E784;display:flex;align-items:center;justify-content:center;font-size:16px\">✦<\u002Fspan>\n              <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:#fff\">AI Analysis<\u002Fdiv><div style=\"font-size:10.5px;color:#6FA693\">{{ sel.aiVerdict }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;margin-bottom:16px;display:flex;align-items:center;gap:14px\">\n              <svg width=\"58\" height=\"58\" viewBox=\"0 0 58 58\" style=\"flex:0 0 auto\">\n                <circle cx=\"29\" cy=\"29\" r=\"23\" fill=\"none\" stroke=\"rgba(255,255,255,.12)\" stroke-width=\"6\"><\u002Fcircle>\n                <circle cx=\"29\" cy=\"29\" r=\"23\" fill=\"none\" stroke=\"#00E784\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-dasharray=\"144.5\" stroke-dashoffset=\"{{ sel.confOffset }}\" transform=\"rotate(-90 29 29)\"><\u002Fcircle>\n                <text x=\"29\" y=\"33\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"14\" font-weight=\"700\" font-family=\"Space Grotesk\">{{ sel.confLabel }}<\u002Ftext>\n              <\u002Fsvg>\n              <div><div style=\"font-size:12px;color:#fff;font-weight:600;margin-bottom:3px\">Confidence<\u002Fdiv><div style=\"font-size:11.5px;color:#8FBDAD;line-height:1.4\">{{ sel.confNote }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-size:11px;color:#6FA693;font-weight:600;letter-spacing:.4px;margin-bottom:9px\">SIGNALS DETECTED<\u002Fdiv>\n            <sc-for list=\"{{ sel.signalList }}\" as=\"sg\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:9px;margin-bottom:10px;font-size:12.5px;line-height:1.45;color:#CFE7DC\"><span style=\"color:#00E784;flex:0 0 auto\">◆<\u002Fspan><span>{{ sg.t }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"display:flex;align-items:flex-end;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:13px 14px;margin:14px 0\">\n              <div style=\"flex:1\"><div style=\"font-size:11px;color:#6FA693;font-weight:600;margin-bottom:8px\">SCORE TREND · last 6 scans<\u002Fdiv>\n                <svg width=\"100%\" height=\"42\" viewBox=\"0 0 200 42\" preserveAspectRatio=\"none\">\n                  <polyline points=\"{{ sel.sparkPoints }}\" fill=\"none\" stroke=\"#00E784\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n                <\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"text-align:right\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#fff\">{{ sel.score }}<\u002Fdiv><div style=\"font-size:10.5px;color:{{ sel.trendColor }}\">{{ sel.trendLabel }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-size:11px;color:#6FA693;font-weight:600;letter-spacing:.4px;margin-bottom:9px\">RECOMMENDED ACTIONS<\u002Fdiv>\n            <sc-for list=\"{{ sel.actions }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <div style=\"background:rgba(0,231,132,.1);border:1px solid rgba(0,231,132,.2);border-radius:11px;padding:11px 13px;margin-bottom:9px\">\n                <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:10px;font-weight:700;color:#00382F;background:#00E784;border-radius:6px;padding:2px 7px\">{{ a.pri }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#fff;margin-top:7px;line-height:1.4\">{{ a.t }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===================== AI WORKFLOW ===================== -->\n      <sc-if value=\"{{ isWf }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"max-width:1180px\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap\">\n          <div>\n            <h1 style=\"font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;margin:0;letter-spacing:-.5px;color:#08231D\">AI Risk Workflow<\u002Fh1>\n            <p style=\"margin:5px 0 0;font-size:13px;color:#647a71\">Automation that watches backlog updates, scores risk, and flags issues to the right people — before they derail the sprint or PI.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #E4EAE6;border-radius:14px;padding:12px 16px\">\n            <div style=\"text-align:right\"><div style=\"font-size:11px;color:#9aa8a1\">Last run {{ scanAgo }} · next in 4m<\u002Fdiv><div style=\"font-size:12.5px;font-weight:600;color:#0B7A4F\">Workflow {{ masterLabel }}<\u002Fdiv><\u002Fdiv>\n            <button onclick=\"{{ toggleMaster }}\" style=\"{{ masterTrackStyle }}\"><span style=\"{{ masterKnobStyle }}\"><\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- stats -->\n        <div style=\"display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap\">\n          <sc-for list=\"{{ wfStats }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <div style=\"flex:1 1 150px;background:#fff;border:1px solid #E4EAE6;border-radius:14px;padding:15px 17px\">\n              <div style=\"font-size:11px;color:#7b8d85;font-weight:600;letter-spacing:.2px\">{{ s.label }}<\u002Fdiv>\n              <div style=\"font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;margin-top:7px;color:#0B2A23\">{{ s.value }}<\u002Fdiv>\n              <div style=\"font-size:11px;color:#9aa8a1;margin-top:4px\">{{ s.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- pipeline -->\n        <div style=\"background:#00382F;border-radius:16px;padding:18px 20px;margin-bottom:18px\">\n          <div style=\"font-size:11px;color:#6FA693;font-weight:600;letter-spacing:.4px;margin-bottom:13px\">PIPELINE<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap\">\n            <sc-for list=\"{{ pipeline }}\" as=\"p\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:6px\">\n                <div style=\"background:rgba(0,231,132,.12);border:1px solid rgba(0,231,132,.25);border-radius:11px;padding:11px 15px;min-width:0\">\n                  <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:15px\">{{ p.icon }}<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:#fff\">{{ p.name }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:#8FBDAD;margin-top:3px\">{{ p.note }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"color:#00E784;font-size:16px\">{{ p.arrow }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start\">\n          <!-- LEFT col -->\n          <div style=\"display:flex;flex-direction:column;gap:18px;min-width:0\">\n            <!-- monitored signals -->\n            <div style=\"background:#fff;border:1px solid #E4EAE6;border-radius:16px;padding:20px\">\n              <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin:0 0 4px\">Monitored signals<\u002Fh3>\n              <p style=\"margin:0 0 14px;font-size:12px;color:#8a988f\">Backlog &amp; delivery events the AI watches in real time.<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:11px\">\n                <sc-for list=\"{{ signals }}\" as=\"sig\" hint-placeholder-count=\"6\">\n                  <div style=\"border:1px solid {{ sig.border }};background:{{ sig.bg }};border-radius:12px;padding:13px 14px;display:flex;align-items:flex-start;gap:11px\">\n                    <span style=\"width:32px;height:32px;border-radius:9px;background:#E3EFEA;color:#0B7A4F;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto\">{{ sig.icon }}<\u002Fspan>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:12.5px;font-weight:600;color:#15302a\">{{ sig.name }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#8a988f;margin-top:2px;line-height:1.35\">{{ sig.desc }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <button onclick=\"{{ sig.toggle }}\" style=\"{{ sig.trackStyle }}\"><span style=\"{{ sig.knobStyle }}\"><\u002Fspan><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- detection rules -->\n            <div style=\"background:#fff;border:1px solid #E4EAE6;border-radius:16px;padding:20px\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n                <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin:0\">Detection rules<\u002Fh3>\n                <span style=\"font-size:11px;color:#9aa8a1\">{{ rulesActiveLabel }} active<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ rules }}\" as=\"rule\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid #EEF2F0\">\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n                      <span style=\"font-size:13px;font-weight:600;color:#15302a\">{{ rule.name }}<\u002Fspan>\n                      <span style=\"font-size:10px;font-weight:700;color:{{ rule.sevText }};background:{{ rule.sevBg }};border-radius:6px;padding:2px 7px\">{{ rule.sev }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#7b8d85;line-height:1.4\"><span style=\"color:#0B7A4F;font-weight:600\">IF<\u002Fspan> {{ rule.cond }} <span style=\"color:#0B7A4F;font-weight:600\">→<\u002Fspan> {{ rule.outcome }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right;flex:0 0 auto\"><div style=\"font-size:10.5px;color:#9aa8a1\">threshold<\u002Fdiv><div style=\"font-size:13px;font-weight:700;color:#0B7A4F\">{{ rule.thresh }}<\u002Fdiv><\u002Fdiv>\n                  <button onclick=\"{{ rule.toggle }}\" style=\"{{ rule.trackStyle }}\"><span style=\"{{ rule.knobStyle }}\"><\u002Fspan><\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- RIGHT col -->\n          <div style=\"display:flex;flex-direction:column;gap:18px;min-width:0\">\n            <!-- scoring -->\n            <div style=\"background:#fff;border:1px solid #E4EAE6;border-radius:16px;padding:20px\">\n              <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin:0 0 4px\">Scoring model<\u002Fh3>\n              <p style=\"margin:0 0 14px;font-size:11.5px;color:#8a988f\">Risk score = Probability × Impact (1–25)<\u002Fp>\n              <sc-for list=\"{{ thresholds }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid #EEF2F0\">\n                  <span style=\"width:12px;height:12px;border-radius:50%;background:{{ t.dot }};flex:0 0 auto\"><\u002Fspan>\n                  <span style=\"font-size:12.5px;font-weight:600;color:#15302a;flex:1\">{{ t.label }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#647a71\">{{ t.range }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#9aa8a1;width:64px;text-align:right\">{{ t.action }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"margin-top:13px;background:#FFFBF0;border:1px solid #F0E0B0;border-radius:10px;padding:11px 12px;font-size:11.5px;color:#7a5a16;line-height:1.5\"><strong>Human-in-the-loop gate:<\u002Fstrong> flags at ≥ 80% confidence auto-accept into the register; anything below routes to the RMO review queue for accept / dismiss before it counts.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- routing -->\n            <div style=\"background:#fff;border:1px solid #E4EAE6;border-radius:16px;padding:20px\">\n              <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin:0 0 14px\">Routing &amp; notifications<\u002Fh3>\n              <sc-for list=\"{{ routes }}\" as=\"rt\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid #EEF2F0\">\n                  <span style=\"width:30px;height:30px;border-radius:8px;background:{{ rt.bg }};color:{{ rt.fg }};display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto\">{{ rt.icon }}<\u002Fspan>\n                  <div style=\"flex:1;min-width:0\"><div style=\"font-size:12.5px;font-weight:600;color:#15302a\">{{ rt.channel }}<\u002Fdiv><div style=\"font-size:11px;color:#8a988f\">{{ rt.when }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <!-- run log -->\n            <div style=\"background:#fff;border:1px solid #E4EAE6;border-radius:16px;padding:20px\">\n              <h3 style=\"font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin:0 0 12px\">Recent runs<\u002Fh3>\n              <sc-for list=\"{{ runs }}\" as=\"run\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #EEF2F0\">\n                  <span style=\"width:8px;height:8px;border-radius:50%;background:{{ run.dot }};flex:0 0 auto\"><\u002Fspan>\n                  <div style=\"flex:1;min-width:0\"><div style=\"font-size:12px;font-weight:600;color:#15302a\">{{ run.trigger }}<\u002Fdiv><div style=\"font-size:10.5px;color:#9aa8a1\">{{ run.time }} · {{ run.scanned }} items<\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-size:11.5px;font-weight:700;color:{{ run.flagColor }}\">{{ run.flags }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===================== OVERVIEW ===================== -->\n      <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"max-width:1080px\">\n        <!-- hero -->\n        <div style=\"background:linear-gradient(150deg,#00453A,#00302A);border-radius:20px;padding:30px 32px;color:#DCEFE7;margin-bottom:20px;position:relative;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:14px\">\n            <span style=\"width:9px;height:9px;border-radius:50%;background:#00E784;display:inline-block;animation:rr-pulse 1.6s infinite\"><\u002Fspan>\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:1.2px;color:#7FB6A4\">DELIVERY RISK INTELLIGENCE<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;margin:0;letter-spacing:-.6px;color:#fff;max-width:760px;line-height:1.2\">AI watches every backlog signal. The Risk Office stays in control.<\u002Fh1>\n          <p style=\"margin:14px 0 0;font-size:14px;line-height:1.65;color:#AFD3C5;max-width:720px\">Risk Radar continuously monitors backlog and external signals across Careem's Scrum/SAFe ARTs, scores each risk by <strong style=\"color:#fff\">Probability × Impact<\u002Fstrong>, and classifies it as a Risk, Dependency, or Blocker. A confidence gate auto-accepts high-certainty flags and routes the rest to human review — keeping the loop fast at scale yet always accountable.<\u002Fp>\n          <div style=\"display:flex;gap:26px;margin-top:22px;flex-wrap:wrap\">\n            <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#fff\">42<\u002Fdiv><div style=\"font-size:11px;color:#7FB6A4;margin-top:2px\">work items monitored<\u002Fdiv><\u002Fdiv>\n            <div style=\"width:1px;background:rgba(255,255,255,.12)\"><\u002Fdiv>\n            <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#fff\">3<\u002Fdiv><div style=\"font-size:11px;color:#7FB6A4;margin-top:2px\">ARTs · Pay · Rides · Identity<\u002Fdiv><\u002Fdiv>\n            <div style=\"width:1px;background:rgba(255,255,255,.12)\"><\u002Fdiv>\n            <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#fff\">80%<\u002Fdiv><div style=\"font-size:11px;color:#7FB6A4;margin-top:2px\">human-review confidence gate<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- principles -->\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px\">\n          <sc-for list=\"{{ ovPrinciples }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid #E4EAE6;border-radius:16px;padding:20px\">\n              <span style=\"width:36px;height:36px;border-radius:10px;background:#DBF7E8;color:#0B7A4F;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:13px\">{{ p.icon }}<\u002Fspan>\n              <div style=\"font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:#08231D;margin-bottom:6px\">{{ p.title }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#647a71;line-height:1.55\">{{ p.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- features -->\n        <div style=\"background:#fff;border:1px solid #E4EAE6;border-radius:16px;padding:24px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px\">\n            <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;margin:0;color:#08231D\">What's inside<\u002Fh2>\n            <span style=\"font-size:11.5px;color:#9aa8a1\">Monitor → Investigate → Decide → Automate<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px 26px\">\n            <sc-for list=\"{{ ovFeatures }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div style=\"border-top:2px solid #E3EFEA;padding-top:13px\">\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:.5px;color:#0B7A4F;text-transform:uppercase;margin-bottom:11px\">{{ f.group }}<\u002Fdiv>\n                <sc-for list=\"{{ f.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:10px;align-items:flex-start;margin-bottom:9px\">\n                    <span style=\"color:#00C46F;font-size:13px;flex:0 0 auto;line-height:1.5\">◆<\u002Fspan>\n                    <span style=\"font-size:13px;color:#3c4a44;line-height:1.5\">{{ it }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid #EEF2F0\">\n            <button onclick=\"{{ goDash }}\" style=\"background:#00E784;color:#00382F;border:none;border-radius:10px;padding:11px 18px;font:600 13px 'IBM Plex Sans';cursor:pointer\">Open dashboard →<\u002Fbutton>\n            <button onclick=\"{{ goWf }}\" style=\"background:#fff;color:#0B7A4F;border:1px solid #BCEBD3;border-radius:10px;padding:11px 18px;font:600 13px 'IBM Plex Sans';cursor:pointer\">See the AI workflow<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'dashboard',\n    selId: 'RR-204',\n    scanning: false,\n    scanned: false,\n    master: true,\n    signalsOff: {},\n    rulesOff: {},\n    reviews: {},     // id -> 'accepted' | 'dismissed'\n    overrides: {},   // id -> {p,i}\n    statuses: {},    // id -> status string\n    audits: {},      // id -> [{icon,text,time,color}]\n  };\n\n  // ---------- human-in-the-loop actions ----------\n  doAccept(id){\n    this.setState(s=>({reviews:{...s.reviews,[id]:'accepted'},\n      audits:{...s.audits,[id]:[...(s.audits[id]||[]),{icon:'✓',text:'Confirmed by RMO',time:'just now',color:'#16A06A'}]}}));\n  }\n  doDismiss(id){\n    this.setState(s=>({reviews:{...s.reviews,[id]:'dismissed'},\n      audits:{...s.audits,[id]:[...(s.audits[id]||[]),{icon:'✕',text:'Dismissed as false positive by RMO',time:'just now',color:'#B11D14'}]}}));\n  }\n  doStatus(id,status,label,icon,color){\n    this.setState(s=>({statuses:{...s.statuses,[id]:status},\n      audits:{...s.audits,[id]:[...(s.audits[id]||[]),{icon,text:label,time:'just now',color}]}}));\n  }\n  doAdjust(id,dp,di,curP,curI){\n    const p=Math.max(1,Math.min(5,curP+dp)); const i=Math.max(1,Math.min(5,curI+di));\n    if(p===curP&&i===curI) return;\n    this.setState(s=>({overrides:{...s.overrides,[id]:{p,i}},\n      audits:{...s.audits,[id]:[...(s.audits[id]||[]),{icon:'✎',text:'Score adjusted to P'+p+'×I'+i+'='+(p*i)+' by RMO',time:'just now',color:'#946400'}]}}));\n  }\n\n  // ---------- helpers ----------\n  sev(s){\n    if(s>=15) return {k:'Critical',t:'#B11D14',bg:'#FBD8D5',dot:'#E5453B',cell:'#F6CFCA'};\n    if(s>=10) return {k:'High',t:'#B5521A',bg:'#FFE3D0',dot:'#EE7B36',cell:'#FBDCC4'};\n    if(s>=5)  return {k:'Medium',t:'#946400',bg:'#FFF1CC',dot:'#E8A93B',cell:'#FBEFC6'};\n    return {k:'Low',t:'#0B7A4F',bg:'#DBF7E8',dot:'#16A06A',cell:'#E6F8EE'};\n  }\n  statusStyle(s){\n    const m={\n      'Open':{t:'#5a6b63',bg:'#EDF1EF'},\n      'Mitigating':{t:'#0B7A4F',bg:'#DBF7E8'},\n      'Monitoring':{t:'#0B6B7A',bg:'#D9F0F5'},\n      'Blocked':{t:'#B11D14',bg:'#FBD8D5'},\n      'Closed':{t:'#6B776F',bg:'#ECEFED'},\n    };\n    return m[s]||m['Open'];\n  }\n  typeStyle(t){\n    const m={\n      'Risk':{c:'#7a5a16',bg:'#FBF0D6'},\n      'Dependency':{c:'#0B6B7A',bg:'#DCF0F5'},\n      'Blocker':{c:'#B11D14',bg:'#FBDDD9'},\n    };\n    return m[t]||m['Risk'];\n  }\n  switchStyle(on){\n    return {\n      track:'width:38px;height:22px;border-radius:12px;border:none;cursor:pointer;padding:0;flex:0 0 auto;position:relative;transition:.18s;background:'+(on?'#00C46F':'#cfd8d3'),\n      knob:'position:absolute;top:2px;left:'+(on?'18px':'2px')+';width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25);display:block',\n    };\n  }\n\n  RISKS(){\n    return [\n      {id:'RR-204',title:'Payment gateway latency above SLA',wi:'CPAY-1182',type:'Risk',cat:'Technical',p:4,i:5,owner:{name:'Layla H.',initials:'LH'},team:'ART: Pay Platform',sprint:'Sprint 26.3',pi:'PI 26.2',fw:'Scrum + SAFe',status:'Mitigating',flag:true,conf:92,trend:'up',signal:'p95 latency +38% across 3 builds; 2 payment stories rolled into next sprint.',detected:'18 Jun 2026',\n        desc:'The wallet top-up payment gateway is breaching its p95 latency SLA under peak load. Error-budget burn is accelerating and two payment stories have already slipped, putting the Sprint 26.3 goal and the Pay PI objective at risk.',\n        mit:'Stabilise gateway under load, cap retry storms, and validate with a load test before the PI closes.',\n        steps:[{text:'Cap gateway retries & add circuit breaker',who:'Pay Platform',done:true},{text:'Page on-call SRE for live triage',who:'SRE',done:true},{text:'Pull load-test story into Sprint 26.3',who:'Layla H.',done:false},{text:'Re-baseline error budget',who:'RMO',done:false}],\n        linked:[{key:'CPAY-1182',sum:'Wallet top-up p95 latency regression',status:'In Progress'},{key:'CPAY-1190',sum:'Gateway retry backoff & circuit breaker',status:'To Do'},{key:'CPAY-1175',sum:'Payment SDK timeout tuning',status:'Blocked'}],\n        signalList:[{t:'p95 latency rose +38% over the last 3 CI builds'},{t:'2 payment stories rolled from Sprint 26.2 → 26.3'},{t:'Error-budget burn at 2.4× the normal rate'}],\n        actions:[{pri:'Now',t:'Page Pay Platform on-call to triage gateway latency'},{pri:'Today',t:'Cap retries and add a circuit breaker on the Pay SDK'},{pri:'This sprint',t:'Pull the load-test story forward before PI close'}]},\n\n      {id:'RR-198',title:'KYC vendor API v2 deprecation',wi:'CID-742',type:'Dependency',cat:'External',p:3,i:5,owner:{name:'Omar F.',initials:'OF'},team:'ART: Identity',sprint:'Sprint 26.3',pi:'PI 26.2',fw:'SAFe',status:'Open',flag:true,conf:87,trend:'up',signal:'Vendor EOL notice parsed from changelog — v2 KYC API sunset in 30 days, blocks 4 Identity features.',detected:'19 Jun 2026',\n        desc:'The done:false},{text:'Unblock Food ETA once stable',who:'RTE',done:false}],\n        linked:[{key:'CRD-908',sum:'ETA service map tiles integration',status:'Blocked'},{key:'CRD-912',sum:'Tile caching layer',status:'To Do'}],\n        signalList:[{t:'Sustained HTTP 429 responses in staging'},{t:'ETA service test suite cannot run'},{t:'Food ETA (RR-233) depends on this service'}],\n        actions:[{pri:'Now',t:'Escalate rate-limit increase with the provider'},{pri:'Today',t:'Add a tile cache to decouple from the provider'},{pri:'Track',t:'Notify Food ART of the cascading dependency'}]},\n\n      {id:'RR-189',title:'Wallet ledger reconciliation drift',wi:'CPAY-1203',type:'Risk',cat:'Technical',p:3,i:5,owner:{name:'Hassan T.',initials:'HT'},team:'ART: Pay Platform',sprint:'Sprint 26.3',pi:'PI 26.2',fw:'Scrum',status:'Mitigating',flag:true,conf:84,trend:'up',signal:'Nightly reconciliation variance exceeded threshold on 2 consecutive nights.',detected:'19 Jun 2026',\n        desc:'Nightly wallet-ledger reconciliation has shown variance above the tolerance threshold two nights running. Untreated, this risks financial-integrity issues in the Pay ledger.',\n        mit:'Freeze ledger deploys, run a reconciliation audit, and identify the drift source.',\n        steps:[{text:'Freeze ledger-impacting deploys',who:'Hassan T.',done:true},{text:'Run full recon audit',who:'Pay Platform',done:false},{text:'Root-cause drift source',who:'Pay Platform',done:false}],\n        linked:[{key:'CPAY-1203',sum:'Ledger reconciliation job',status:'In Progress'},{key:'CPAY-1208',sum:'Recon variance alerting',status:'To Do'}],\n        signalList:[{t:'Recon variance > threshold on 2 consecutive nights'},{t:'No recent ledger schema change correlates'},{t:'Variance trend is widening, not stable'}],\n        actions:[{pri:'Now',t:'Freeze ledger-impacting deploys'},{pri:'Today',t:'Run a full reconciliation audit'},{pri:'This sprint',t:'Add automated variance alerting'}]},\n\n      {id:'RR-241',title:'New KSA fintech reporting regulation',wi:'CPAY-1220',type:'Risk',cat:'Compliance',p:3,i:5,owner:{name:'Fatima Z.',initials:'FZ'},team:'ART: Pay Platform',sprint:'Sprint 26.4',pi:'PI 26.2',fw:'SAFe',status:'Open',flag:true,conf:81,trend:'up',signal:'Regulator circular ingested — new transaction reporting format required for Pay in KSA.',detected:'21 Jun 2026',\n        desc:'A regulator circular introduces a new transaction-reporting format for fintech operators in KSA. Careem Pay reporting must comply, adding unplanned scope to the PI.',\n        mit:'Loop in Compliance, scope the reporting change, and add it to PI planning.',\n        steps:[{text:'Review circular with Compliance',who:'Fatima Z.',done:true},{text:'Scope reporting format change',who:'Pay Platform',done:false},{text:'Add feature to PI backlog',who:'RTE',done:false}],\n        linked:[{key:'CPAY-1220',sum:'KSA regulatory reporting format',status:'To Do'}],\n        signalList:[{t:'Regulator circular parsed from external feed'},{t:'Affects Pay transaction reporting in KSA'},{t:'No compliance story currently scoped'}],\n        actions:[{pri:'Now',t:'Loop in Compliance to interpret the circular'},{pri:'This PI',t:'Scope a reporting-format feature'},{pri:'Track',t:'Flag as a regulatory PI milestone'}]},\n\n      {id:'RR-167',title:'CI test environment instability',wi:'PLT-330',type:'Blocker',cat:'Technical',p:4,i:3,owner:{name:'Bilal M.',initials:'BM'},team:'ART: Platform',sprint:'Sprint 26.3',pi:'PI 26.2',fw:'Scrum + SAFe',status:'Blocked',flag:true,conf:76,trend:'up',signal:'CI flakiness at 22% — blocking merges for 3 teams.',detected:'17 Jun 2026',blocking:6,\n        desc:'Continuous-integration flakiness has climbed to 22%, repeatedly failing valid merges and blocking three teams from delivering. It is the single largest throughput drag this sprint.',\n        mit:'Quarantine flaky tests and stabilise the shared CI environment.',\n        steps:[{text:'Quarantine top 10 flaky tests',who:'Bilal M.',done:true},{text:'Stabilise shared runners',who:'Platform',done:false},{text:'Add CI health dashboard',who:'Platform',done:false}],\n        linked:[{key:'PLT-330',sum:'CI runner stability',status:'In Progress'},{key:'PLT-334',sum:'Flaky test quarantine',status:'In Progress'}],\n        signalList:[{t:'CI pass-rate dropped to 78%'},{t:'3 teams report blocked merges'},{t:'Average PR cycle time up 40%'}],\n        actions:[{pri:'Now',t:'Quarantine the flakiest tests'},{pri:'This sprint',t:'Stabilise shared CI runners'},{pri:'Track',t:'Stand up a CI health dashboard'}]},\n\n      {id:'RR-211',title:'Ramadan surge capacity untested',wi:'CRD-870',type:'Risk',cat:'Schedule',p:3,i:4,owner:{name:'Sara K.',initials:'SK'},team:'ART: Rides',sprint:'Sprint 26.3',pi:'PI 26.2',fw:'SAFe',status:'Open',flag:true,conf:78,trend:'up',signal:'Load-test feature unstarted 6 days before PI end.',detected:'18 Jun 2026',\n        desc:'Surge-capacity load testing for the Ramadan demand peak has not started, with only six days left in the PI. Without it, the platform may be unproven against peak traffic.',\n        mit:'Pull the load-test feature into the current sprint and reserve an environment.',\n        steps:[{text:'Reserve load-test environment',who:'Sara K.',done:false},{text:'Run peak surge scenarios',who:'Rides',done:false},{text:'Review results at PI demo',who:'RTE',done:false}],\n        linked:[{key:'CRD-870',sum:'Ramadan surge load test',status:'To Do'}],\n        signalList:[{t:'Load-test feature still in \"To Do\" 6 days before PI end'},{t:'No environment reserved for surge testing'},{t:'Historical Ramadan traffic is 3.2× baseline'}],\n        actions:[{pri:'Now',t:'Pull the load-test story into the current sprint'},{pri:'Today',t:'Reserve a dedicated load-test environment'},{pri:'Track',t:'Review surge results at the PI demo'}]},\n\n      {id:'RR-258',title:'Velocity decline across Rides ART',wi:'CRD-955',type:'Risk',cat:'Resource',p:3,i:4,owner:{name:'Sara K.',initials:'SK'},team:'ART: Rides',sprint:'Sprint 26.3',pi:'PI 26.2',fw:'SAFe',status:'Open',flag:true,conf:73,trend:'down',signal:'ART velocity −18% across 2 PIs; 3 recent departures.',detected:'16 Jun 2026',\n        desc:'The Rides ART velocity has fallen 18% over two PIs, coinciding with three departures. PI commitments are at risk of being missed if capacity is not rebalanced.',\n        mit:'Rebalance capacity across teams and backfill key roles.',\n        steps:[{text:'Re-forecast PI capacity',who:'RTE',done:true},{text:'Backfill 2 senior engineers',who:'Eng Mgmt',done:false},{text:'Trim PI scope to capacity',who:'Sara K.',done:false}],\n        linked:[{key:'CRD-955',sum:'ART capacity re-forecast',status:'In Progress'}],\n        signalList:[{t:'Velocity trend −18% over the last 2 PIs'},{t:'3 engineers left the ART recently'},{t:'PI commitment exceeds re-forecast capacity'}],\n        actions:[{pri:'Now',t:'Re-balance ART capacity to commitments'},{pri:'This PI',t:'Backfill the two senior vacancies'},{pri:'Track',t:'Trim PI scope to realistic capacity'}]},\n\n      {id:'RR-220',title:'Captain onboarding A/B inconclusive',wi:'CGR-512',type:'Risk',cat:'Quality',p:2,i:3,owner:{name:'Nadia R.',initials:'NR'},team:'ART: Growth',sprint:'Sprint 26.3',pi:'PI 26.2',fw:'Scrum',status:'Monitoring',flag:false,conf:null,trend:'flat',signal:'',detected:'15 Jun 2026',\n        desc:'The A/B test on the new captain onboarding flow has not reached significance. The risk is low but worth monitoring before a wider rollout decision.',\n        mit:'Extend the experiment window and monitor sample size before deciding.',\n        steps:[{text:'Extend experiment by 1 week',who:'Nadia R.',done:true},{text:'Review at next growth sync',who:'Growth',done:false}],\n        linked:[{key:'CGR-512',sum:'Onboarding flow experiment',status:'In Progress'}],\n        signalList:[],\n        actions:[]},\n\n      {id:'RR-233',title:'Food ETA depends on Rides ETA service',wi:'CFD-441',type:'Dependency',cat:'Technical',p:3,i:3,owner:{name:'Mariam S.',initials:'MS'},team:'ART: Food',sprint:'Sprint 26.3',pi:'PI 26.2',fw:'SAFe',status:'Open',flag:false,conf:null,trend:'flat',signal:'',detected:'18 Jun 2026',dependsOn:'RR-176',\n        desc:'The Food delivery ETA model consumes the shared Rides ETA service. While not yet critical, it inherits any instability from that service (currently blocked under RR-176).',\n        mit:'Coordinate with Rides on the ETA service timeline; plan a fallback estimate.',\n        steps:[{text:'Align on Rides ETA timeline',who:'Mariam S.',done:false},{text:'Design fallback ETA estimate',who:'Food',done:false}],\n        linked:[{key:'CFD-441',sum:'Food ETA model integration',status:'To Do'}],\n        signalList:[],\n        actions:[]},\n\n      {id:'RR-150',title:'Design system v4 breaking changes',wi:'PLT-298',type:'Risk',cat:'Technical',p:2,i:4,owner:{name:'Tariq B.',initials:'TB'},team:'ART: Platform',sprint:'Sprint 26.3',pi:'PI 26.2',fw:'Scrum',status:'Monitoring',flag:false,conf:null,trend:'flat',signal:'',detected:'14 Jun 2026',\n        desc:'The shared design system v4 introduces breaking component API changes. Impact is contained for now but several squads will need migration effort next PI.',\n        mit:'Publish a migration guide and stagger adoption across squads.',\n        steps:[{text:'Publish migration guide',who:'Tariq B.',done:true},{text:'Stagger squad adoption',who:'Platform',done:false}],\n        linked:[{key:'PLT-298',sum:'Design system v4 migration',status:'To Do'}],\n        signalList:[],\n        actions:[]},\n\n      {id:'RR-225',title:'Push notification vendor migration',wi:'PLT-315',type:'Dependency',cat:'External',p:2,i:3,owner:{name:'Aisha N.',initials:'AN'},team:'ART: Platform',sprint:'Sprint 26.4',pi:'PI 26.2',fw:'SAFe',status:'Open',flag:false,conf:null,trend:'flat',signal:'',detected:'13 Jun 2026',\n        desc:'A planned migration to a new push-notification vendor introduces a dependency for any feature relying on push. Low risk currently, tracked for sequencing.',\n        mit:'Sequence the migration ahead of dependent features; run a parallel pilot.',\n        steps:[{text:'Pilot new vendor in staging',who:'Aisha N.',done:false},{text:'Sequence ahead of dependents',who:'RTE',done:false}],\n        linked:[{key:'PLT-315',sum:'Push vendor migration pilot',status:'To Do'}],\n        signalList:[],\n        actions:[]},\n    ];\n  }\n\n  spark(trend, score){\n    let base;\n    if(trend==='up') base=[Math.max(2,score-9),score-7,score-5,score-5,score-2,score];\n    else if(trend==='down') base=[Math.min(25,score+7),score+5,score+4,score+2,score+1,score];\n    else base=[score-1,score,score-1,score,score-1,score];\n    const n=base.length, w=200, h=42, pad=4;\n    return base.map((v,idx)=>{\n      const x=(idx/(n-1))*w;\n      const y=h-pad-(Math.max(0,Math.min(25,v))/25)*(h-pad*2);\n      return x.toFixed(0)+','+y.toFixed(1);\n    }).join(' ');\n  }\n\n  renderVals(){\n    const REV=this.state.reviews, OV=this.state.overrides, ST=this.state.statuses, AUD=this.state.audits;\n    const GATE=80; // confidence gate %\n    const ruleFor={'RR-204':'Latency regression','RR-198':'Vendor EOL keyword','RR-176':'Persistent blocker','RR-189':'Latency regression','RR-241':'Vendor EOL keyword','RR-167':'Persistent blocker','RR-211':'PI deadline proximity','RR-258':'Velocity drop'};\n    const allRisks=this.RISKS().map(r=>{\n      const ov=OV[r.id]; const p=ov?ov.p:r.p; const i=ov?ov.i:r.i;\n      const score=p*i; const sv=this.sev(score);\n      const status=ST[r.id]||r.status; const st=this.statusStyle(status); const ty=this.typeStyle(r.type);\n      const autoAccept=r.flag && r.conf>=GATE;\n      const reviewState=REV[r.id] || (!r.flag ? 'accepted' : (autoAccept?'accepted':'pending'));\n      // audit trail (synthetic base + runtime)\n      const audit=[];\n      if(r.flag){\n        audit.push({icon:'✦',text:'AI flagged · '+r.conf+'% confidence',time:r.detected,color:'#0B7A4F'});\n        if(autoAccept && !REV[r.id]) audit.push({icon:'✓',text:'Auto-accepted · confidence ≥ '+GATE+'%',time:r.detected,color:'#16A06A'});\n      } else {\n        audit.push({icon:'✎',text:'Manually tracked by RMO',time:r.detected,color:'#647a71'});\n      }\n      const audit2=audit.concat(AUD[r.id]||[]);\n      return {...r, p, i, score, sevLabel:sv.k, sevText:sv.t, sevBg:sv.bg, sevDot:sv.dot, sevCell:sv.cell,\n        status, statusText:st.t, statusBg:st.bg, typeColor:ty.c, typeBg:ty.bg, noflag:!r.flag,\n        reviewState, overridden:!!ov, rule:ruleFor[r.id]||'AI heuristic', audit:audit2,\n        open:()=>this.setState({screen:'detail',selId:r.id})};\n    });\n    const risks=allRisks.filter(r=>r.reviewState==='accepted');\n    const pending=allRisks.filter(r=>r.reviewState==='pending');\n    const dismissedCount=allRisks.filter(r=>r.reviewState==='dismissed').length;\n    const reviewQueue=pending.map(r=>({id:r.id,title:r.title,conf:r.conf,signal:r.signal,team:r.team,\n      sevLabel:r.sevLabel,sevText:r.sevText,sevBg:r.sevBg,dot:r.sevDot,rule:r.rule,\n      open:()=>this.setState({screen:'detail',selId:r.id}),\n      accept:()=>this.doAccept(r.id), dismiss:()=>this.doDismiss(r.id)}));\n\n    // ----- KPIs -----\n    const ch=risks.filter(r=>r.sevLabel==='Critical'||r.sevLabel==='High').length;\n    const blk=risks.filter(r=>r.type==='Blocker').length;\n    const dep=risks.filter(r=>r.type==='Dependency').length;\n    const flagged=risks.filter(r=>r.flag);\n    const kpis=[\n      {label:'CRITICAL & HIGH',value:ch,icon:'▲',bg:'#FBD8D5',fg:'#B11D14',sub:'3 need action today',subColor:'#B11D14'},\n      {label:'ACTIVE BLOCKERS',value:blk,icon:'⊘',bg:'#FBDDD9',fg:'#B11D14',sub:'blocking 10 stories',subColor:'#647a71'},\n      {label:'AT-RISK DEPS',value:dep,icon:'⇄',bg:'#DCF0F5',fg:'#0B6B7A',sub:'2 cross-ART',subColor:'#647a71'},\n      {label:'AI FLAGS · 24H',value:flagged.length,icon:'✦',bg:'#DBF7E8',fg:'#0B7A4F',sub:'2 new since 09:00',subColor:'#0B7A4F'},\n      {label:'NEEDS REVIEW',value:pending.length,icon:'⏳',bg:'#FFF1CC',fg:'#946400',sub:(pending.length?'awaiting RMO':'all clear'),subColor:'#946400'},\n    ];\n\n    // ----- AI insights -----\n    const times=['2m ago','9m ago','24m ago','1h ago','2h ago','3h ago','4h ago','5h ago'];\n    const insights=flagged.sort((a,b)=>b.conf-a.conf||b.score-a.score).map((r,idx)=>({\n      id:r.id,title:r.title,signal:r.signal,conf:r.conf,time:times[idx]||'today',\n      sevLabel:r.sevLabel,sevText:r.sevText,sevBg:r.sevBg,dot:r.sevDot,\n      action:(r.actions[0]?r.actions[0].t:'Review with owner'),\n      open:()=>this.setState({screen:'detail',selId:r.id})\n    }));\n\n    // ----- matrix -----\n    const cells=[];\n    for(let i=5;i>=1;i--){\n      for(let p=1;p<=5;p++){\n        const sv=this.sev(p*i);\n        const dots=risks.filter(r=>r.p===p&&r.i===i).map(r=>({id:r.id,color:r.sevDot,open:()=>this.setState({screen:'detail',selId:r.id})}));\n        cells.push({p,i,bg:sv.cell,dots});\n      }\n    }\n\n    // ----- deps & blockers -----\n    const blockers=risks.filter(r=>r.type==='Blocker').map(r=>({id:r.id,title:r.title,blocking:r.blocking||0,team:r.team,open:r.open}));\n    const depLinks=[\n      {from:'RR-233 Food ETA',rel:'depends on',to:'RR-176 (Blocked)',toColor:'#B11D14'},\n      {from:'RR-198 KYC v2',rel:'blocks',to:'4 Identity features',toColor:'#B5521A'},\n      {from:'RR-176 Map tiles',rel:'cascades to',to:'Food ETA · 2 ARTs',toColor:'#B5521A'},\n      {from:'RR-167 CI env',rel:'blocks merges for',to:'3 teams',toColor:'#B11D14'},\n    ];\n\n    // ----- selected detail -----\n    const base=allRisks.find(r=>r.id===this.state.selId)||allRisks[0];\n    const conf=base.conf||0;\n    const circ=144.5; const confOffset=(circ*(1-conf/100)).toFixed(1);\n    const trendMap={up:{c:'#FF9B6B',l:'▲ rising'},down:{c:'#FFD27A',l:'▼ falling'},flat:{c:'#8FBDAD',l:'— stable'}};\n    const tm=trendMap[base.trend]||trendMap.flat;\n    const sel={...base,\n      confOffset, confLabel:(base.flag?conf+'%':'—'),\n      confNote:(base.flag?'AI is confident this is a genuine, actionable risk.':'No active AI flag — within thresholds.'),\n      aiVerdict:(base.flag?'Flagged by workflow':'Monitoring · no flag'),\n      sparkPoints:this.spark(base.trend,base.score),\n      trendColor:tm.c, trendLabel:tm.l,\n      signalList:(base.signalList.length?base.signalList:[{t:'No anomalies detected in recent backlog updates.'}]),\n      actions:(base.actions.length?base.actions:[{pri:'Monitor',t:'Keep under observation; no action required yet.'}]),\n      steps:base.steps.map(s=>({text:s.text,who:s.who,\n        mark:(s.done?'✓':''),\n        color:(s.done?'#16A06A':'#cdd8d2'),\n        fill:(s.done?'#16A06A':'transparent'),\n        textColor:(s.done?'#9aa8a1':'#3c4a44')})),\n      linked:base.linked.map(l=>{\n        const cmap={'In Progress':{c:'#0B7A4F',bg:'#DBF7E8'},'Blocked':{c:'#B11D14',bg:'#FBD8D5'},'At Risk':{c:'#B5521A',bg:'#FFE3D0'},'To Do':{c:'#5a6b63',bg:'#EDF1EF'}};\n        const cc=cmap[l.status]||cmap['To Do'];\n        return {key:l.key,sum:l.sum,status:l.status,color:cc.c,bg:cc.bg};\n      }),\n      // human-in-the-loop\n      reviewState:base.reviewState, overridden:base.overridden, audit:base.audit, rule:base.rule,\n      isPending:base.reviewState==='pending', isAccepted:base.reviewState==='accepted', isDismissed:base.reviewState==='dismissed',\n      accept:()=>this.doAccept(base.id), dismiss:()=>this.doDismiss(base.id),\n      incP:()=>this.doAdjust(base.id,1,0,base.p,base.i), decP:()=>this.doAdjust(base.id,-1,0,base.p,base.i),\n      incI:()=>this.doAdjust(base.id,0,1,base.p,base.i), decI:()=>this.doAdjust(base.id,0,-1,base.p,base.i),\n      mitigate:()=>this.doStatus(base.id,'Mitigating','Marked Mitigating by RMO','→','#0B7A4F'),\n      escalate:()=>this.doStatus(base.id,'Blocked','Escalated to leadership by RMO','▲','#B11D14'),\n    };\n    const stepBtn='width:26px;height:26px;border-radius:7px;border:1px solid #D6E0DB;background:#F4F8F6;color:#0B7A4F;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1';\n\n    // ----- layout styles -----\n    const dashGridStyle=\"display:grid;gap:18px;align-items:start;grid-template-columns:360px minmax(0,1fr);grid-template-areas:'matrix feed' 'blockers blockers' 'deps deps' 'register register';\";\n    const feedFlexStyle='display:grid;grid-template-columns:1fr 1fr;gap:11px;align-content:start;';\n\n    // ----- nav -----\n    const navBase='display:flex;align-items:center;gap:11px;width:100%;border:none;text-align:left;cursor:pointer;padding:11px 13px;border-radius:11px;font:600 14px \"IBM Plex Sans\";margin-bottom:4px;transition:.15s;';\n    const onDash=this.state.screen==='dashboard'||this.state.screen==='detail';\n    const onWf=this.state.screen==='workflow';\n    const onOv=this.state.screen==='overview';\n    const navDashStyle=navBase+(onDash?'background:rgba(0,231,132,.16);color:#EAFFF4;':'background:transparent;color:#9CC4B6;');\n    const navWfStyle=navBase+(onWf?'background:rgba(0,231,132,.16);color:#EAFFF4;':'background:transparent;color:#9CC4B6;');\n    const navOvStyle=navBase+(onOv?'background:rgba(0,231,132,.16);color:#EAFFF4;':'background:transparent;color:#9CC4B6;');\n\n    // ----- topbar / status -----\n    const screen=this.state.screen;\n    const titles={dashboard:['Dashboard','Risk overview across Pay, Rides & Identity ARTs'],detail:['Risk detail',base.id+' · '+base.team],workflow:['AI Workflow','Automation configuration & monitoring'],overview:['Overview','What Risk Radar is & how it works']};\n    const pt=titles[screen]||titles.dashboard;\n    const scanning=this.state.scanning;\n    const statusLabel=scanning?'Scanning backlog…':'AI active';\n    const statusDot=scanning?'#FFB23E':'#00C46F';\n    const statusText=scanning?'#9A6B00':'#0B7A4F';\n    const statusBg=scanning?'#FFF1CC':'#DBF7E8';\n    const statusBorder=scanning?'#F3DCA0':'#BCEBD3';\n\n    // ----- workflow data -----\n    const sigDefs=[\n      {key:'jira',name:'Backlog issue updates',desc:'Status, priority & field changes on stories',icon:'❏'},\n      {key:'velocity',name:'Velocity & burndown',desc:'Sprint & ART throughput trends',icon:'📉'},\n      {key:'blocked',name:'Blocked / flagged transitions',desc:'Items entering blocked or impediment states',icon:'⊘'},\n      {key:'deps',name:'Dependency link changes',desc:'New or broken cross-team links',icon:'⇄'},\n      {key:'external',name:'External feeds',desc:'Vendor changelogs & regulator circulars',icon:'🌐'},\n      {key:'dates',name:'Sprint / PI dates',desc:'Iteration & PI boundary proximity',icon:'🗓'},\n    ];\n    const signals=sigDefs.map(s=>{\n      const on=!this.state.signalsOff[s.key];\n      const sw=this.switchStyle(on);\n      return {...s,trackStyle:sw.track,knobStyle:sw.knob,\n        border:on?'#CFE9DD':'#E8EDEA',bg:on?'#F6FCF9':'#fff',\n        toggle:()=>this.setState(st=>({signalsOff:{...st.signalsOff,[s.key]:!st.signalsOff[s.key]}}))};\n    });\n\n    const ruleDefs=[\n      {key:'r1',name:'Velocity drop',sev:'Schedule',cond:'ART velocity falls > 15% across 2 sprints',outcome:'flag Schedule risk',thresh:'15%'},\n      {key:'r2',name:'Persistent blocker',sev:'Blocker',cond:'a story is Blocked > 2 days',outcome:'escalate Blocker',thresh:'2d'},\n      {key:'r3',name:'Risky dependency',sev:'Dependency',cond:'a link points to a blocked item',outcome:'flag Dependency',thresh:'—'},\n      {key:'r4',name:'Latency regression',sev:'Technical',cond:'p95 latency regresses across 3 builds',outcome:'flag Technical risk',thresh:'3 builds'},\n      {key:'r5',name:'Vendor EOL keyword',sev:'External',cond:'an external feed mentions EOL / deprecation',outcome:'flag External dependency',thresh:'NLP'},\n      {key:'r6',name:'PI deadline proximity',sev:'Schedule',cond:'a key feature is unstarted < 7 days to PI end',outcome:'flag Schedule risk',thresh:'7d'},\n    ];\n    const sevChip={Schedule:{t:'#B5521A',bg:'#FFE3D0'},Blocker:{t:'#B11D14',bg:'#FBD8D5'},Dependency:{t:'#0B6B7A',bg:'#DCF0F5'},Technical:{t:'#7a5a16',bg:'#FBF0D6'},External:{t:'#0B6B7A',bg:'#DCF0F5'}};\n    const rules=ruleDefs.map(r=>{\n      const on=!this.state.rulesOff[r.key]; const sw=this.switchStyle(on); const sc=sevChip[r.sev]||sevChip.Schedule;\n      return {...r,trackStyle:sw.track,knobStyle:sw.knob,sevText:sc.t,sevBg:sc.bg,\n        toggle:()=>this.setState(st=>({rulesOff:{...st.rulesOff,[r.key]:!st.rulesOff[r.key]}}))};\n    });\n    const rulesActive=ruleDefs.filter(r=>!this.state.rulesOff[r.key]).length;\n\n    const wfStats=[\n      {label:'ITEMS MONITORED',value:'42',sub:'across 3 ARTs'},\n      {label:'RULES ACTIVE',value:rulesActive+'/6',sub:'detection rules'},\n      {label:'FLAGS · 7 DAYS',value:'23',sub:'8 still open'},\n      {label:'PENDING REVIEW',value:String(pending.length),sub:'awaiting RMO'},\n      {label:'DISMISSED',value:String(dismissedCount),sub:'false positives'},\n      {label:'AVG CONFIDENCE',value:'82%',sub:'on raised flags'},\n    ];\n    const pipeline=[\n      {icon:'📥',name:'Ingest',note:'backlog + feeds',arrow:'→'},\n      {icon:'🔍',name:'Detect',note:'signal rules',arrow:'→'},\n      {icon:'⚖️',name:'Score',note:'P × I',arrow:'→'},\n      {icon:'🏷',name:'Classify',note:'risk / dep / blocker',arrow:'→'},\n      {icon:'📣',name:'Flag & route',note:'notify owners',arrow:''},\n    ];\n    const thresholds=[\n      {label:'Critical',range:'15 – 25',dot:'#E5453B',action:'escalate'},\n      {label:'High',range:'10 – 14',dot:'#EE7B36',action:'flag + owner'},\n      {label:'Medium',range:'5 – 9',dot:'#E8A93B',action:'watch'},\n      {label:'Low',range:'1 – 4',dot:'#16A06A',action:'log'},\n    ];\n    const routes=[\n      {channel:'Slack #risk-radar',when:'All new flags, real-time',icon:'#',bg:'#DCF0F5',fg:'#0B6B7A'},\n      {channel:'Email · RMO digest',when:'Critical & High, immediate',icon:'✉',bg:'#FBD8D5',fg:'#B11D14'},\n      {channel:'Jira comment + label',when:'On the flagged work item',icon:'❏',bg:'#DBF7E8',fg:'#0B7A4F'},\n    ];\n    const runs=[\n      {trigger:'Regulator circular ingested',time:'2m ago',scanned:42,flags:'+1 flag',flagColor:'#B11D14',dot:'#E5453B'},\n      {trigger:'Sprint board updated',time:'18m ago',scanned:42,flags:'+2 flags',flagColor:'#B5521A',dot:'#EE7B36'},\n      {trigger:'CI build completed',time:'46m ago',scanned:12,flags:'+1 flag',flagColor:'#B5521A',dot:'#EE7B36'},\n      {trigger:'Scheduled hourly scan',time:'1h ago',scanned:42,flags:'0 flags',flagColor:'#0B7A4F',dot:'#16A06A'},\n    ];\n    const msw=this.switchStyle(this.state.master);\n\n    // ----- overview screen -----\n    const ovPrinciples=[\n      {icon:'◎',title:'Attention follows risk',body:'Size and position map to urgency — the AI insight stream leads; matrix, blockers and register sit one glance away.'},\n      {icon:'✦',title:'AI proposes, humans decide',body:'The model detects and scores at scale; the RMO confirms, adjusts or dismisses. The loop never closes on its own.'},\n      {icon:'⚖',title:'One scoring language',body:'Every risk is Probability × Impact (1–25), mapped to four severity bands that drive colour, routing and escalation.'},\n    ];\n    const ovFeatures=[\n      {group:'Monitor',items:['AI Insights stream — auto-generated, ranked by confidence','Risk Matrix — 5×5 Probability × Impact heat map','KPI vitals strip — exposure index, critical/high, blockers, deps, review']},\n      {group:'Investigate',items:['Active Blockers & Cross-Team Dependencies, tracked separately','Full Risk Register with click-through drill-down','Risk detail — signals, mitigation plan, linked items, trend & actions']},\n      {group:'Decide · human-in-the-loop',items:['80% confidence gate — auto-accept above, review below','Needs-review queue with Accept / Dismiss','Score override, Mitigate / Escalate, full audit trail']},\n      {group:'Automate',items:['Pipeline: Ingest → Detect → Score → Classify → Flag & route','Monitored signals & 6 toggleable detection rules','Scoring model, routing channels and run log']},\n    ];\n\n    return {\n      ovPrinciples, ovFeatures,\n      // nav + screen\n      goDash:()=>this.setState({screen:'dashboard'}),\n      goWf:()=>this.setState({screen:'workflow'}),\n      goOverview:()=>this.setState({screen:'overview'}),\n      navDashStyle, navWfStyle, navOvStyle,\n      isDash:screen==='dashboard', isDetail:screen==='detail', isWf:screen==='workflow', isOverview:screen==='overview',\n      pageTitle:pt[0], pageSub:pt[1],\n      scanAgo:this.state.scanned?'just now':'2m ago',\n      statusLabel,statusDot,statusText,statusBg,statusBorder,\n      runScan:()=>{ this.setState({scanning:true}); setTimeout(()=>this.setState({scanning:false,scanned:true}),1300); },\n      // dashboard\n      kpis, insights, insightCount:insights.length,\n      matrixCells:cells, blockers, depLinks,\n      blockerCount:blockers.length, depCount:depLinks.length,\n      rows:risks, rowCount:risks.length,\n      dashGridStyle, feedFlexStyle,\n      // human-in-the-loop\n      reviewQueue, hasPending:pending.length>0, pendingCount:pending.length, dismissedCount,\n      // detail\n      sel, stepBtn,\n      // workflow\n      signals, rules, rulesActiveLabel:rulesActive+'/6', wfStats, pipeline, thresholds, routes, runs,\n      masterLabel:this.state.master?'ON':'PAUSED',\n      toggleMaster:()=>this.setState(s=>({master:!s.master})),\n      masterTrackStyle:msw.track, masterKnobStyle:msw.knob,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
